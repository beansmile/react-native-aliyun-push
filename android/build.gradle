apply plugin: 'com.android.library'

description = 'react-native-aliyun-push'

buildscript {
    repositories {
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:1.3.1'
    }
}

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 28
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    jcenter()
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.facebook.react:react-native:+'

    api ('com.aliyun.ams:alicloud-android-push:3.7.7') {
        exclude module:'alicloud-android-utdid'
    }

    api ('com.aliyun.ams:alicloud-android-third-push:3.7.7') {
        exclude module:'alicloud-android-utdid'
    }

    api ('com.aliyun.ams:alicloud-android-third-push-fcm:3.7.7') {
      exclude module:'alicloud-android-utdid'
    }

    api ('com.aliyun.ams:alicloud-android-third-push-xiaomi:3.7.7') {
      exclude module:'alicloud-android-utdid'
    }

    api ('com.aliyun.ams:alicloud-android-third-push-huawei:3.7.7') {
      exclude module:'alicloud-android-utdid'
    }


    api ('com.aliyun.ams:alicloud-android-third-push-oppo:3.7.7') {
      exclude module:'alicloud-android-utdid'
    }

    // shortcutBadger
    api 'me.leolin:ShortcutBadger:1.1.22@aar'

    implementation 'com.google.code.gson:gson:2.8.9'
}
